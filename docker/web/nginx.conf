# RoboProbe dashboard front nginx (T-116, docs/17 §5).
# style-src 'unsafe-inline' is required for Plotly-injected <style> nodes (docs/31 TM-05).

worker_processes auto;
error_log /var/log/nginx/error.log notice;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml font/woff2;

    map $uri $dashboard_cache_control {
        default "";
        /index.html "no-cache";
        /config.json "no-cache";
        ~^/assets/.+-[A-Za-z0-9_-]+[.][^/]+$ "public, max-age=31536000, immutable";
    }

    map $uri $sse_buffering {
        default "";
        /api/v1/events "no";
    }

    log_format dashboard '$remote_addr [$time_local] "$request_method $uri $server_protocol" '
                         '$status $body_bytes_sent';

    server {
        listen 8080;
        server_name localhost;
        root /usr/share/nginx/html;
        index index.html;
        access_log /var/log/nginx/access.log dashboard;

        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; connect-src 'self'; frame-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;
        add_header Cache-Control $dashboard_cache_control;
        add_header X-Accel-Buffering $sse_buffering always;

        location = /config.json {
            alias /var/lib/nginx/runtime/config.json;
            default_type application/json;
        }

        location /assets/ {
            try_files $uri =404;
        }

        location = /api/v1/events {
            # The status-only access log records failures without logging EventSource credentials.
            error_log /dev/null;
            proxy_pass http://api:8000/api/v1/events;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 1h;
        }

        location /api/ {
            proxy_pass http://api:8000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location / {
            try_files $uri /index.html;
        }
    }
}
