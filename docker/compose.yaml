# RoboProbe local / single-host stack (docs/17 §4, docs/29). Run through the Makefile:
#   make up      -> --profile core up -d      make down -> stop and remove containers + network
#   make db-up   -> postgres only             add `--profile dev` to publish Postgres on 127.0.0.1
# Every tunable comes from ../.env (docs/27 §4.12); only image names/tags have defaults here.
# Later tasks append *new service blocks only* (api/orchestrator/worker: T-047, web: T-116,
# gazebo: T-095, observability: T-125).
name: roboprobe

x-backend: &backend
  image: ghcr.io/codewithjha/roboprobe-backend:${ROBOPROBE_IMAGE_TAG:-dev}
  build:
    context: ..
    dockerfile: docker/backend.Dockerfile
  env_file:
    - path: ../.env
      required: false
  environment:
    # In-network DSN without a password: the `db_password` secret is merged in by the settings
    # loader from /run/secrets (docs/27 §2), so the password never appears in env or URLs.
    ROBOPROBE_DATABASE__URL: postgresql+psycopg://${ROBOPROBE_DB_USER:-roboprobe}@postgres:5432/${ROBOPROBE_DB_NAME:-roboprobe}
  secrets: [db_password]
  volumes: ["../data/artifacts:/data/artifacts"]
  read_only: true
  tmpfs: [/tmp]
  restart: unless-stopped

services:
  postgres:
    image: postgres:17@sha256:b60e90042aa6b8dbecd58e224b3e36114dbf8ad754465264c2476ad58a86e45c
    profiles: [core, dev]
    environment:
      POSTGRES_DB: ${ROBOPROBE_DB_NAME:-roboprobe}
      POSTGRES_USER: ${ROBOPROBE_DB_USER:-roboprobe}
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets: [db_password]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  # Dev-only host access to Postgres (Compose cannot publish a port per profile, so a tiny TCP
  # forwarder carries it). Bound to loopback only (docs/21 §1).
  postgres-port:
    image: alpine/socat:1.8.0.3@sha256:beb4a68d9e4fe6b0f21ea774a0fde6c31f580dde6368939ed70100c5385b015e
    profiles: [dev]
    command: ["TCP-LISTEN:5432,fork,reuseaddr", "TCP:postgres:5432"]
    ports: ["127.0.0.1:${ROBOPROBE_DB_PORT:-5432}:5432"]
    read_only: true
    depends_on: {postgres: {condition: service_healthy}}
    restart: unless-stopped

  migrate:
    <<: *backend
    profiles: [core]
    command: ["db", "upgrade"]
    restart: "no"
    depends_on: {postgres: {condition: service_healthy}}

  # Observability profile (T-125, T-126). Scrapes API :8000 and the orchestrator/worker
  # internal metrics port (worker.health_port, default 9101). Those services join this
  # network when the core profile defines them; until then the targets stay down.
  prometheus:
    image: prom/prometheus@sha256:63805ebb8d2b3920190daf1cb14a60871b16fd38bed42b857a3182bc621f4996
    profiles: [observability]
    entrypoint: ["/bin/sh", "/etc/prometheus/render_and_run.sh"]
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/render_and_run.sh:/etc/prometheus/render_and_run.sh:ro
    secrets: [api_token]
    ports: ["127.0.0.1:${ROBOPROBE_PROMETHEUS_PORT:-9090}:9090"]
    read_only: true
    tmpfs: [/tmp, /prometheus]
    user: "65534:65534"
    restart: unless-stopped

  grafana:
    image: grafana/grafana-oss@sha256:62d2b9d20a19714ebfe48d1bb405086081bc602aa053e28cf6d73c7537640dfb
    profiles: [observability]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_DISABLE_LOGIN_FORM: "false"
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin_password
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_PATHS_DATA: /tmp/grafana
      GF_PATHS_LOGS: /tmp/grafana/logs
      GF_PATHS_PLUGINS: /tmp/grafana/plugins
    secrets: [grafana_admin_password]
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/etc/grafana/dashboards:ro
    ports: ["127.0.0.1:${ROBOPROBE_GRAFANA_PORT:-3000}:3000"]
    read_only: true
    tmpfs: [/tmp]
    depends_on: [prometheus]
    restart: unless-stopped

  otel-collector:
    image: otel/opentelemetry-collector@sha256:580cc87f5ea6c9e3969c37f3c5394b7a8385abb8189df0ddc63b9575a00f52fc
    profiles: [observability]
    command: ["--config=/etc/otel/config.yaml"]
    volumes:
      - ./observability/otel-collector.yaml:/etc/otel/config.yaml:ro
    read_only: true
    tmpfs: [/tmp]
    restart: unless-stopped

  jaeger:
    image: jaegertracing/all-in-one@sha256:836e9b69c88afbedf7683ea7162e179de63b1f981662e83f5ebb68badadc710f
    profiles: [observability]
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports: ["127.0.0.1:${ROBOPROBE_JAEGER_PORT:-16686}:16686"]
    read_only: true
    tmpfs: [/tmp]
    restart: unless-stopped

secrets:
  db_password:
    file: ../secrets/db_password
  grafana_admin_password:
    file: ${ROBOPROBE_GRAFANA_ADMIN_PASSWORD_FILE:-observability/dev-secrets/grafana_admin_password}
  api_token:
    file: ${ROBOPROBE_API_TOKEN_FILE:-observability/dev-secrets/api_token}

volumes:
  pgdata: {}
