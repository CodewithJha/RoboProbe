# RoboProbe configuration file template — GENERATED by scripts/gen_config_docs.py; do not edit.
# Copy to ./roboprobe.toml (git-ignored) or point ROBOPROBE_CONFIG_FILE at your copy, then
# uncomment the keys you want to change. Precedence, highest first: CLI flags > ROBOPROBE_* env
# vars > .env > this file > secret files > defaults (docs/27 §2).
# Never put secrets here (docs/27 §6): use env vars or secret files for SecretStr keys.

# Deployment environment.
# env = "local"

[database]
# SQLAlchemy DSN of the RoboProbe database. Keep the password out of the URL and use `password_file`
# or the `db_password` secret file instead.
# url = "postgresql+psycopg://roboprobe@localhost:5432/roboprobe"
# File holding the database password; merged into `url` [path].
# password_file =  (unset by default)
# Connection pool size per process.
# pool_size = 5
# Server-side statement timeout [ms].
# statement_timeout_ms = 30000
# PostgreSQL LISTEN/NOTIFY channel for live events.
# notify_channel = "roboprobe_events"

[storage]
# Root directory of run artefacts [path].
# artifact_root = "data/artifacts"
# Root of per-run scratch directories [path].
# workdir_root = "data/workdirs"
# Free-space floor that raises `DISK_LOW` [GB].
# min_free_gb = 5.0
# Artifact store plugin key in the `roboprobe.stores` entry-point group.
# backend = "local"

[storage.retention]
# Days to keep rosbag artefacts [d].
# bags_days = 30
# Keep bags of failing runs regardless of `bags_days`.
# keep_failure_bags = true

[storage.bundle]
# Campaign bundle format version written on export.
# format_version = 1
# Maximum total uncompressed payload accepted on import [bytes].
# max_uncompressed_bytes = 2147483648
# Maximum size of any single tar member on import [bytes].
# max_member_bytes = 536870912
# I/O chunk size when hashing or copying bundle members [bytes].
# read_chunk_bytes = 1048576
# Hex length of hostname hashes written into exported manifests (TM-15).
# hostname_hash_hex = 16

[api]
# Bind address; any non-loopback address requires `api.token`.
# host = "127.0.0.1"
# Listen port.
# port = 8000
# URL prefix of the versioned API.
# base_path = "/api/v1"
# Bearer token required on every request (and for any non-loopback `host`).
# token = ...  (secret: set ROBOPROBE_API__TOKEN instead)
# Origins allowed by CORS (dev server and dashboard).
# cors_origins = ["http://localhost:5173", "http://localhost:8080"]
# Default JSON trace sampling target [Hz].
# trace_default_hz = 10.0
# Maximum JSON trace sampling target [Hz].
# trace_max_hz = 50.0
# Concurrent API report/export jobs.
# report_workers = 1
# Concurrent API experiment jobs.
# experiment_workers = 1
# Maximum planned strategy/seed cells per API experiment.
# experiment_max_cells = 128
# Cached risk slices per API process.
# slice_cache_size = 32
# Risk slice computation timeout [s].
# slice_timeout_s = 30.0
# Maximum request body size [MB].
# max_upload_mb = 10
# Default page size [items].
# page_limit_default = 50
# Maximum page size [items].
# page_limit_max = 500
# Retention of idempotency keys [s].
# idempotency_ttl_s = 86400
# Base URL for RFC 9457 problem `type` links (docs/errors.md anchors).
# error_type_base = "https://github.com/CodewithJha/RoboProbe/blob/main/docs/errors.md"
# HMAC key for opaque pagination cursors. Override in production so cursors survive process
# restarts; the committed default is for local/dev only.
# cursor_secret = "roboprobe-dev-cursor-secret"

[api.sse]
# Keep-alive ping interval on SSE streams [s].
# ping_interval_s = 15.0
# How often the outbox listener re-reads events.id when NOTIFY is missed [s].
# poll_interval_s = 2.0
# Per-subscriber SSE queue depth; overflow drops the oldest event and sends resync.
# queue_size = 256
# Maximum events read from the outbox per poll [rows].
# batch_size = 200
# Initial delay before reopening a dropped LISTEN connection [s].
# reconnect_initial_s = 0.5
# Cap on LISTEN reconnect backoff [s].
# reconnect_max_s = 30.0
# TCP timeout for the dedicated LISTEN and poll connections [s].
# connect_timeout_s = 5.0

[runner]
# Campaign loop tick [s].
# tick_interval_s = 1.0
# Target in-flight runs = workers x factor.
# inflight_factor = 1.5
# Reaper sweep interval [s].
# reaper_interval_s = 10.0
# Heartbeat age after which a run is reaped [s].
# heartbeat_timeout_s = 30.0
# Run attempts (1 + retries).
# max_attempts = 3
# Maximum runs per campaign.
# max_budget = 20000
# Maximum proposals per batch.
# max_batch_size = 32
# Maximum repeats per manual request.
# max_manual_repeats = 100
# Queue priority for manual runs.
# manual_priority = 10
# Whether INVALID runs consume campaign budget.
# count_invalid_in_budget = false
# Campaigns driven concurrently per orchestrator.
# max_concurrent_campaigns = 4
# Queue priority for confirmatory interaction runs (lower runs sooner).
# confirm_priority = 10

[runner.auto_pause]
# INVALID share that pauses a campaign [0-1].
# invalid_ratio = 0.2
# Finished runs before `invalid_ratio` is evaluated.
# min_runs = 20
# Consecutive INVALID runs that pause a campaign.
# max_consecutive_invalid = 10

[runner.alerts]
# Emit NO_WORKERS when a RUNNING campaign has no worker this long [s].
# no_workers_after_s = 60.0
# Emit GP_FALLBACK_REPEATED after this many consecutive selector fallbacks.
# gp_fallback_repeat = 3

[runner.analysis]
# Re-run incremental failure analysis every N finished runs.
# incremental_every_n = 25
# Concurrent analysis jobs per orchestrator process (ThreadPoolExecutor).
# max_workers = 1

[runner.retry]
# Attempts including the first.
# max_attempts = 3
# First backoff delay [s].
# base_delay_s = 0.5
# Backoff delay cap [s].
# max_delay_s = 10.0

[worker]
# Simulator backend key (`kinematic2d`, `gazebo_nav2`); required to start a worker.
# backend =  (unset by default)
# Worker id prefix; id = `<prefix>:<pid>:<slot>` (default: host name).
# id_prefix = "<hostname>"
# Simulation slots per process.
# concurrency = 1
# Queue poll interval [s].
# poll_interval_s = 1.0
# Heartbeat interval [s].
# heartbeat_interval_s = 5.0
# Max wait when joining the heartbeat thread on stop [s].
# heartbeat_join_timeout_s = 10.0
# Grace period to finish runs on SIGTERM [s].
# drain_timeout_s = 600.0
# Default wall-clock limit per run [s].
# default_wall_timeout_s = 300.0
# Default simulated-time budget per run [s].
# default_sim_time_budget_s = 120.0
# Bind address for the worker `/healthz` + metrics server.
# health_host = "127.0.0.1"
# Internal `/healthz` + metrics port.
# health_port = 9101

[backends.kinematic2d]
# Integration time step [s].
# dt = 0.05
# Trace sampling rate [Hz].
# sample_hz = 20.0
# Simulated lidar beams.
# lidar_beams = 180
# Simulated depth-camera beams.
# depth_beams = 60
# Robot, controller and planner constants (calibrated in T-034) [path].
# model_file = "configs/backends/kinematic2d_v1.yaml"
# Perception degradation constants for depth simulation (T-034) [path].
# perception_model_file = "configs/perception/oakd_k2d_v1.yaml"
# Designed GT canonical unit-cube points (T-034) [path].
# calibration_file = "configs/reference/k2d_gt_canonical.yaml"

[backends.gazebo_nav2]
# Worker image reference recorded in run manifests (informational).
# image = "ghcr.io/codewithjha/roboprobe-gazebo:${tag}"
# ROS package of the launch.
# launch_package = "roboprobe_ros"
# Episode launch file.
# launch_file = "episode.launch.py"
# Topic and frame names used by the ROS nodes [path].
# topics_file = "ros_ws/src/roboprobe_ros/config/topics.yaml"
# Package-relative base world patched per scenario.
# base_world = "nav2_minimal_tb4_sim/worlds/warehouse.sdf"
# Package-relative Nav2 parameter file overlaid per SUT profile.
# base_nav2_params = "nav2_bringup/params/nav2_params.yaml"
# Run Gazebo without a GUI.
# headless_rendering = true
# Force Mesa software rendering (`LIBGL_ALWAYS_SOFTWARE=1`).
# software_rendering = false
# ROS 2 middleware implementation.
# rmw = "rmw_cyclonedds_cpp"
# First `ROS_DOMAIN_ID`; each worker slot adds its index.
# domain_id_base = 30
# Time allowed for Nav2 to become ACTIVE [s].
# startup_timeout_s = 60.0
# Extra wall time after estimated startup and navigation [s].
# wall_margin_s = 30.0
# Time from SIGINT to SIGTERM on episode teardown [s].
# teardown_grace_s = 10.0
# Time from SIGTERM to SIGKILL after an episode [s].
# teardown_term_wait_s = 5.0
# Trace sampling rate [Hz].
# sample_hz = 20.0
# When to record rosbag2 MCAP: never, failures, always.
# record_bag = "failures"
# Gazebo episodes allowed in parallel on one host.
# max_parallel_per_host = 1
# Perception degradation constants (docs/06 §3.3) [path].
# perception_model_file = "configs/perception/oakd_lowlight_v1.yaml"

[backends.gazebo_nav2.physics]
# Target real-time factor of the simulation.
# real_time_factor = 1.0

[scenario.map_alignment]
# Minimum occupied-cell IoU between kinematic2d and Gazebo maps.
# min_iou = 0.95
# Allowed relative difference between backend nominal path lengths.
# path_length_tolerance_ratio = 0.02

[scenario]
# Sampler draws before rejection sampling of constrained spaces gives up.
# constraint_max_attempts = 1000
# Largest absolute integer exponent allowed in a constraint (TM-03).
# constraint_max_literal_exponent = 8
# Maximum YAML alias expansions in one uploaded document (TM-02).
# yaml_max_aliases = 32

[selection.probe]
# Warm-up share of the budget [0-1].
# n0_fraction = 0.1
# Minimum warm-up runs as a multiple of the dimension d.
# n0_min_factor = 2
# Random exploration share.
# epsilon = 0.05
# Diversity penalty weight.
# lambda_div = 1.0
# Diversity radius in GP length-scales.
# kappa_radius = 0.5
# Straddle (LSE) beta.
# beta_straddle = 1.96
# Boundary bisection steps.
# refine_bisect_steps = 4
# Perturbations per refined point.
# refine_perturb_n = 4
# Perturbation std in the unit cube.
# refine_perturb_std = 0.05
# Window for phase-weight adaptation.
# adapt_window = 20
# Weight moved from ModeSearch to Boundary after an unproductive window.
# adapt_shift = 0.2
# Lower bound on ModeSearch weight after adaptive shifts.
# mode_search_floor = 0.2

[selection.probe.weights]
# Mode-search share.
# mode_search = 0.6
# Boundary-refinement share.
# boundary = 0.25
# Local refinement share.
# refine = 0.15

[selection.gp]
# Training points kept by the GP.
# max_points = 1500
# Likelihood noise floor.
# noise_lower_bound = 0.0001
# Torch intra-op threads.
# torch_threads = 4

[selection.acq]
# Optimiser restarts.
# num_restarts = 10
# Raw samples for initialisation.
# raw_samples = 512
# Optimiser iterations.
# maxiter = 200
# Distance under which candidates are duplicates.
# dedupe_tol = 0.001

[selection.ofat]
# Levels in the unit interval, strictly increasing.
# levels = [0.0, 0.25, 0.5, 0.75, 1.0]

[selection.grid]
# Minimum levels per axis.
# min_levels = 2

[selection.cem]
# Samples drawn per CEM update round.
# round_size = 20
# Fraction of lowest-rho samples kept as elite.
# elite_fraction = 0.2
# Number of truncated-Gaussian mixture components.
# n_components = 1
# Floor on per-dimension proposal std in the unit cube.
# min_std = 0.05

[selection.benchmarks]
# Analytic robustness function evaluated by the benchmark backend.
# function = "multi_mode_6d"
# Observation noise std for multi_mode_6d (ignored by branin_falsify).
# noise = 0.02
# Typical wall time of one analytic episode [s].
# typical_episode_wall_s = 0.001
# Analytic episodes allowed in parallel on one host.
# max_parallel_per_host = 32
# Synthetic trace length written for each episode.
# trace_samples = 2
# Synthetic trace sample period [s].
# trace_dt_s = 0.05
# Expected failure volume fraction of multi_mode_6d under Sobol QMC.
# failure_volume_target = 0.007
# Absolute tolerance on the QMC failure-volume estimate.
# failure_volume_atol = 0.002
# Sobol sample count is 2**volume_qmc_power for the volume gate.
# volume_qmc_power = 16

[selection]
# Refresh the failure-mode cache every N observations.
# mode_cache_refresh_every = 10
# Time limit for `propose` before falling back [s].
# propose_timeout_s = 10.0

[oracles.clear]
# Clearance normaliser [m].
# d_norm = 0.5
# Near-miss (F-NEAR) distance [m].
# d_safe = 0.1
# Robustness magnitude of a zero-speed contact.
# r_contact_base = 0.1
# Impact speed normaliser [m/s].
# v_ref = 0.5

[oracles.goal]
# Minimum robustness magnitude when not reached.
# r_min = 0.01

[oracles.prog]
# Progress window [s].
# window_s = 10.0
# Minimum progress per window [m].
# delta_min = 0.05
# Progress normaliser [m].
# delta_norm = 0.5

[oracles.loc]
# Maximum tolerated pose error [m].
# e_max = 0.5
# Time the error must persist [s].
# hold_s = 2.0

[oracles.nav]
# Robustness assigned to a navigation abort.
# r_abort = -0.5

[oracles.stab]
# Maximum roll/pitch [rad].
# theta_max = 0.35
# Maximum angular rate [rad/s].
# omega_max = 3.0

[oracles.osc]
# Sliding window [s].
# window_s = 5.0
# Yaw-rate magnitude counted as a swing [rad/s].
# omega_min = 0.3
# Sign changes per window before violation.
# n_max = 6

[oracles.infra]
# Largest allowed sampling gap [s].
# max_gap_s = 1.0
# Minimum mean real-time factor.
# min_rtf = 0.2
# Time allowed for the stack to become ACTIVE [s].
# startup_timeout_s = 60.0
# Allowed deviation of the spawn pose [m].
# spawn_tolerance_m = 0.2

[analysis.feature_weights]
# Scenario-parameter block weight.
# param = 1.0
# Failure-class block weight.
# class = 0.75
# Trajectory-feature block weight.
# traj = 0.5

[analysis.hdbscan]
# Minimum cluster size as a share of failures.
# min_cluster_fraction = 0.03
# Absolute minimum cluster size.
# min_cluster_size_floor = 3

[analysis]
# Jaccard overlap that matches modes across runs.
# mode_match_jaccard = 0.5
# Coverage for a parameter range to be characteristic.
# characteristic_coverage = 0.5
# Cross-validation folds.
# cv_folds = 5
# Failures needed before results are flagged confident.
# min_failures_confident = 10

[analysis.gbm]
# Maximum tree depth.
# max_depth = 4
# Learning rate.
# learning_rate = 0.1
# Boosting iterations.
# max_iter = 200

[analysis.rules]
# Maximum rule depth.
# max_depth = 4
# Minimum precision of a reported rule.
# min_precision = 0.6

[analysis.interaction]
# Confirmation repeats per candidate.
# repeats = 3
# Share of repeats that must reproduce the failure.
# success_ratio = 0.67
# Auto-enqueue confirmation for the top-N modes after final analysis (0=off).
# auto_confirm_top_n = 0

[risk.thresholds]
# Upper bound of the safe region.
# safe = 0.05
# Lower bound of the failure-prone region.
# failure = 0.95

[risk]
# Grid points per axis of a 2-D slice.
# slice_resolution = 50
# Maximum on-demand API slice resolution.
# max_slice_resolution = 100
# Sobol QMC sample count for region volume estimates (power of two).
# volume_samples = 8192

[experiments]
# Seeds per strategy and design.
# default_seeds = 30
# Campaigns an experiment runs concurrently.
# max_concurrent_campaigns = 2
# Bootstrap resamples for confidence intervals.
# bootstrap_resamples = 10000
# Significance level.
# alpha = 0.05
# Unit-cube radius matching a found mode to a true one.
# mode_match_radius = 0.05
# Bins per axis for coverage metrics.
# coverage_bins = 5

[experiments.reference_set]
# Reference scenarios.
# n = 20000
# Seed of the reference sample.
# seed = 20261119
# Scenario space id.
# space_id = "warehouse_v1"
# Relative path under artifact root.
# artifact_relpath = "reference/warehouse_v1_k2d.parquet"

[reporting]
# Colour theme token set (Field Notebook).
# theme = "light"

[reporting.figures]
# Figure width in inches.
# width_in = 6.0
# Figure height in inches.
# height_in = 4.0
# Rasterisation DPI (SVG metadata only).
# dpi = 100

[observability]
# Expose Prometheus metrics.
# metrics_enabled = true
# OTLP collector URL; tracing is off when unset.
# otlp_endpoint =  (unset by default)
# Service name in logs/traces; derived per process (`roboprobe-api`, ...).
# service_name =  (unset by default)

[logging]
# Minimum log level.
# level = "INFO"
# `json` (prod/ci) or `console` (human-readable local output).
# format = "json"
# Add module/function/line to logs.
# include_caller = false
