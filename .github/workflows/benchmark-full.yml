# Weekly / manual full analytic benchmark (doc 20 §1, T-064).
# EXP-02-style calibrate run + reduced seed count; compare against committed baseline.
name: benchmark-full

on:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:
    inputs:
      pr_number:
        description: Optional pull request number to comment on
        required: false
        type: string
      seeds:
        description: Seed count for the analytic calibrate run
        required: false
        default: "10"
        type: string

      exp05_source:
        description: Completed EXP-04 run that motivates the experimental profile B
        required: false
        type: string

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: benchmark-full-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  ROBOPROBE_ENV: ci
  OMP_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  TORCH_NUM_THREADS: "1"
  BENCH_TOLERANCE: "0.2"

jobs:
  analytic:
    if: ${{ inputs.exp05_source == '' }}
    name: analytic-exp02
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-backend
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Calibrate analytic EXP-02 (reduced seeds)
        working-directory: backend
        env:
          CALIBRATION_SEEDS: ${{ inputs.seeds || '10' }}
        run: >
          uv run python ../scripts/calibrate_benchmarks.py
          --seeds "$CALIBRATION_SEEDS"
          --budget 150
          --out /tmp/benchmark-current.json
      - name: Compare against weekly baseline
        id: compare
        working-directory: backend
        run: |
          set -o pipefail
          set +e
          uv run python ../scripts/compare_benchmark.py \
            tests/benchmark/baselines/full_weekly.json \
            /tmp/benchmark-current.json \
            --tolerance "${{ env.BENCH_TOLERANCE }}" \
            --summary | tee /tmp/benchmark-summary.md
          status=$?
          set -e
          cat /tmp/benchmark-summary.md >>"$GITHUB_STEP_SUMMARY"
          echo "exit_code=${status}" >>"$GITHUB_OUTPUT"
          exit "${status}"
      - name: Comment on PR (manual dispatch)
        if: >-
          always()
          && github.event_name == 'workflow_dispatch'
          && github.event.inputs.pr_number != ''
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('/tmp/benchmark-summary.md', 'utf8');
            const pr = Number(process.env.PR_NUMBER);
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr,
              body: body,
            });
        env:
          PR_NUMBER: ${{ github.event.inputs.pr_number }}


  exp05-preflight:
    if: >-
      github.event_name == 'workflow_dispatch'
      && github.repository == 'CodewithJha/RoboProbe'
      && github.ref == 'refs/heads/compute/t-120b-exp05-profile-pair'
      && inputs.exp05_source != ''
    permissions:
      actions: read
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate the completed EXP-04 source study
        env:
          GH_TOKEN: ${{ github.token }}
          PREFLIGHT_RUN: ${{ inputs.exp05_source }}
        run: |
          set -euo pipefail
          [[ "$PREFLIGHT_RUN" =~ ^[0-9]+$ ]]
          result=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PREFLIGHT_RUN")
          jq -e '.head_branch=="compute/t-120-gazebo-studies" and .conclusion=="success"' <<<"$result" >/dev/null
          base=$(jq -r .head_sha <<<"$result")
          [[ "$base" == "79b3c3e91a9ac1eb251e74a147754d9f2f410471" ]]
          git merge-base --is-ancestor "$base" HEAD
          git diff --quiet "$base" HEAD -- backend configs docker tasks schemas ros_ws \
            ':(exclude)configs/sut_profiles/tb4_nav2_tuned.yaml'

  exp05:
    name: EXP-05 ${{ matrix.strategy }} rep ${{ matrix.replicate }}
    needs: exp05-preflight
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 345
    strategy:
      fail-fast: false
      matrix:
        strategy: [profile_A, profile_B]
        replicate: [0, 1, 2]
    env:
      STUDY_IMAGE: roboprobe-gazebo-exp05:${{ github.sha }}
      EXP05_STRATEGY: ${{ matrix.strategy }}
      EXP05_REPLICATE: ${{ matrix.replicate }}
      EXP05_SOURCE: ${{ inputs.exp05_source }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the exact Gazebo source and prefetch pinned models
        run: |
          STUDY_OUTPUT="$RUNNER_TEMP/exp05-output"
          printf 'STUDY_OUTPUT=%s\n' "$STUDY_OUTPUT" >>"$GITHUB_ENV"
          mkdir -p "$STUDY_OUTPUT"
          chmod 1777 "$STUDY_OUTPUT"
          docker build --build-arg "REVISION=$GITHUB_SHA" -f docker/gazebo/Dockerfile -t "$STUDY_IMAGE" .
          docker volume create exp05-fuel
          docker run --rm --read-only --tmpfs /tmp -v exp05-fuel:/data/gazebo-fuel "$STUDY_IMAGE" prefetch-fuel
      - name: Create a PostgreSQL instance and record the runner environment
        run: |
          docker network create --internal exp05-net
          docker run --detach --name exp05-db --network exp05-net --network-alias postgres \
            -e POSTGRES_USER=roboprobe -e POSTGRES_DB=roboprobe \
            -e POSTGRES_PASSWORD=roboprobe-ci postgres:17
          timeout 90 bash -c 'until docker exec exp05-db pg_isready -h 127.0.0.1 -U roboprobe -d roboprobe; do sleep 2; done'
          {
            printf 'exp04_source_run_id=%s\n' "$EXP05_SOURCE"
            printf 'git_sha=%s\n' "$GITHUB_SHA"
            printf 'software_rendering=true\nstartup_timeout_s=150\nwall_margin_s=90\n'
            uname -a
            lscpu
            free -h
            docker image inspect --format '{{.Id}}' "$STUDY_IMAGE"
            docker image inspect --format '{{index .RepoDigests 0}}' postgres:17
          } >"$STUDY_OUTPUT/environment.txt"
          docker run --rm --entrypoint /bin/bash "$STUDY_IMAGE" -c 'dpkg-query -W ros-jazzy-navigation2 ros-jazzy-nav2-bringup ros-jazzy-gz-sim-vendor' \
            >>"$STUDY_OUTPUT/environment.txt"
      - name: Collect the registered profile cell and estimate its risk volumes
        timeout-minutes: 310
        run: |
          set -o pipefail
          docker run --name exp05-collector --init --network exp05-net --read-only --tmpfs /tmp --shm-size=1g \
            --mount "type=bind,src=$GITHUB_WORKSPACE,dst=/checkout,readonly" \
            --mount "type=bind,src=$STUDY_OUTPUT,dst=/results" \
            --mount "type=volume,src=exp05-fuel,dst=/data/gazebo-fuel,readonly" \
            -e EXP05_STRATEGY -e EXP05_REPLICATE -e GZ_IP=127.0.0.1 -e RMW_IMPLEMENTATION=rmw_cyclonedds_cpp \
            -e PYTHONPATH=/checkout/backend/src -e LIBGL_ALWAYS_SOFTWARE=1 -e OPENBLAS_NUM_THREADS=1 \
            -e OMP_NUM_THREADS=1 -e MKL_NUM_THREADS=1 \
            -e ROBOPROBE_DATABASE__URL=postgresql+psycopg://roboprobe:roboprobe-ci@postgres/roboprobe \
            -e ROBOPROBE_STORAGE__ARTIFACT_ROOT=/results/artifacts \
            -e ROBOPROBE_BACKENDS__GAZEBO_NAV2__SOFTWARE_RENDERING=true \
            -e ROBOPROBE_BACKENDS__GAZEBO_NAV2__STARTUP_TIMEOUT_S=150 \
            -e ROBOPROBE_BACKENDS__GAZEBO_NAV2__WALL_MARGIN_S=90 \
            -e ROBOPROBE_BACKENDS__GAZEBO_NAV2__IMAGE="$STUDY_IMAGE" \
            -e GZ_SIM_RESOURCE_PATH=/checkout/ros_ws/src/roboprobe_ros/models:/opt/ros/jazzy/share \
            --entrypoint /bin/bash "$STUDY_IMAGE" -eo pipefail -c '
              install -d -m 700 "$HOME" "$ROS_HOME" "$XDG_RUNTIME_DIR"
              source /opt/ros/jazzy/setup.bash
              source /opt/roboprobe/ros_ws/install/setup.bash
              cd /checkout/backend
              /opt/roboprobe/venv/bin/roboprobe db upgrade
              /opt/roboprobe/venv/bin/python /checkout/scripts/collect_exp05.py \
                "$EXP05_STRATEGY" "$EXP05_REPLICATE" /results
              campaign=$(/opt/roboprobe/venv/bin/python -c "import json; print(json.load(open(\"/results/collection.json\"))[\"campaign_id\"])")
              /opt/roboprobe/venv/bin/roboprobe --json analyze --kind full --wait "$campaign" >/results/risk-analysis.json
            ' 2>&1 | tee "$STUDY_OUTPUT/collection.log"
      - name: Preserve the independent campaign database and any partial artifacts
        if: ${{ always() }}
        run: |
          docker stop -t 20 exp05-collector 2>/dev/null || true
          if docker inspect exp05-db >/dev/null 2>&1; then
            docker exec exp05-db pg_dump -Fc -U roboprobe -d roboprobe >"$STUDY_OUTPUT/campaign.dump"
          fi
          if [[ -d "${STUDY_OUTPUT:-}" ]]; then
            sudo chmod -R a+rX "$STUDY_OUTPUT"
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ always() }}
        with:
          name: exp05-${{ matrix.strategy }}-rep${{ matrix.replicate }}-attempt${{ github.run_attempt }}
          path: ${{ env.STUDY_OUTPUT }}
          if-no-files-found: error
          retention-days: 14
