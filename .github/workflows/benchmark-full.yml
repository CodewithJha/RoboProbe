name: T-130 worker-stage diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  profile:
    name: Profile 1 and 8 workers on isolated Ubuntu
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: roboprobe
          POSTGRES_PASSWORD: roboprobe-ci
          POSTGRES_DB: roboprobe_profile
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U roboprobe -d roboprobe_profile"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      ROBOPROBE_ENV: ci
      ROBOPROBE_DATABASE__URL: postgresql+psycopg://roboprobe:roboprobe-ci@127.0.0.1:5432/roboprobe_profile
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      TORCH_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - uses: ./.github/actions/setup-backend
        with:
          python-version: "3.12"
      - name: Profile worker execute stages
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/t130-profile"
          {
            git rev-parse HEAD HEAD^
            nproc
            awk '/Cpus_allowed_list/ {print}' /proc/self/status
          } | tee "$RUNNER_TEMP/t130-profile/host.txt"
          uv run --no-sync --directory backend python ../scripts/t130_worker_stage_profile.py \
            "$RUNNER_TEMP/t130-profile" 2>&1 | tee "$RUNNER_TEMP/t130-profile/stages.txt"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: t130-worker-profiles
          path: |
            ${{ runner.temp }}/t130-profile/*.txt
            ${{ runner.temp }}/t130-profile/*/results.csv
            ${{ runner.temp }}/t130-profile/*/workers-*/*.pstats
            ${{ runner.temp }}/t130-profile/*/workers-*/*.log
