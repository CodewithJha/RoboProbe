name: T-130 standard hosted runner capacity

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    name: Capacity probe ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 5
    steps:
      - name: Report host CPU, affinity, memory, and Linux cgroup ceilings
        run: |
          set -euo pipefail
          printf 'ImageOS=%s\nImageVersion=%s\n' "$ImageOS" "$ImageVersion"
          printf 'nproc=%s\n' "$(nproc)"
          uname -m
          LC_ALL=C lscpu
          free -h
          awk '/Cpus_allowed_list/ {print}' /proc/self/status
          cat /proc/self/cgroup
          for file in /sys/fs/cgroup/{cpu.max,cpuset.cpus.effective,memory.max}; do
            if [[ -r "$file" ]]; then
              printf '%s: ' "$file"
              cat "$file"
            fi
          done
