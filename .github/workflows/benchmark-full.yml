name: T-130 isolated scaling baseline

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scale:
    name: 1, 2, 4, and 8 workers × 10,000 runs
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: roboprobe
          POSTGRES_PASSWORD: roboprobe-ci
          POSTGRES_DB: roboprobe_scale
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U roboprobe -d roboprobe_scale"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      ROBOPROBE_ENV: ci
      ROBOPROBE_DATABASE__URL: postgresql+psycopg://roboprobe:roboprobe-ci@127.0.0.1:5432/roboprobe_scale
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      TORCH_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-backend
        with:
          python-version: "3.12"
      - name: Record isolated runner and workload provenance
        run: |
          mkdir -p "$RUNNER_TEMP/t130"
          {
            printf 'UTC=%s\nImageOS=%s\nImageVersion=%s\n' "$(date -u +%FT%TZ)" "$ImageOS" "$ImageVersion"
            printf 'Run=%s/%s/actions/runs/%s\n' "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID"
            git rev-parse HEAD HEAD^
            sha256sum scripts/load_campaign.py backend/uv.lock
            uname -a
            nproc
            lscpu
            free -h
            df -h "$RUNNER_TEMP"
            docker image inspect postgres:17 --format '{{json .RepoDigests}}'
            for file in /sys/fs/cgroup/{cpu.max,cpuset.cpus.effective,memory.max}; do
              if [[ -r "$file" ]]; then
                printf '%s: ' "$file"
                cat "$file"
              fi
            done
          } | tee "$RUNNER_TEMP/t130/host.txt"
      - name: Run the full scaling matrix and enforce the original gate
        shell: bash
        run: |
          uv run --no-sync --directory backend python ../scripts/load_campaign.py \
            --workers 1,2,4,8 --runs 10000 --backend benchmark --out "$RUNNER_TEMP/t130" \
            2>&1 | tee "$RUNNER_TEMP/t130/harness.log"
      - name: Preserve measurements and checksums
        if: ${{ always() }}
        run: |
          cd "$RUNNER_TEMP/t130"
          find . -type f \( -name '*.csv' -o -name '*.log' -o -name '*.txt' -o -name campaign.json \) \
            -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS
          cat ./*/results.csv >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: t130-isolated-scaling
          path: |
            ${{ runner.temp }}/t130/host.txt
            ${{ runner.temp }}/t130/harness.log
            ${{ runner.temp }}/t130/SHA256SUMS
            ${{ runner.temp }}/t130/*/results.csv
            ${{ runner.temp }}/t130/*/workers-*/*.log
            ${{ runner.temp }}/t130/*/workers-*/campaign.json

  focused-integration:
    name: Exact runner and PostgreSQL integration
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: roboprobe
          POSTGRES_PASSWORD: roboprobe-ci
          POSTGRES_DB: roboprobe_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U roboprobe -d roboprobe_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      ROBOPROBE_ENV: ci
      ROBOPROBE_TEST_DATABASE_URL: postgresql+psycopg://roboprobe:roboprobe-ci@127.0.0.1:5432/roboprobe_test
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      TORCH_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-backend
        with:
          python-version: "3.12"
      - name: Run focused contracts against PostgreSQL and the live orchestrator
        run: |
          uv run --no-sync pytest -q -m 'unit or integration' \
            tests/unit/selection/test_base.py \
            tests/unit/runner/test_campaign_loop.py \
            tests/integration/store/test_repositories_campaign_run.py \
            tests/integration/store/test_run_scheduling.py \
            tests/integration/store/test_queue_exactly_once.py \
            tests/integration/runner/test_restart_resume.py \
            tests/integration/runner/test_orchestrator.py
