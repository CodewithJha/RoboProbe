# Weekly / manual full analytic benchmark (doc 20 §1, T-064).
# EXP-02-style calibrate run + reduced seed count; compare against committed baseline.
name: benchmark-full

on:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:
    inputs:
      pr_number:
        description: Optional pull request number to comment on
        required: false
        type: string
      seeds:
        description: Seed count for the analytic calibrate run
        required: false
        default: "10"
        type: string

      exp04_preflight:
        description: Successful current-main native Gazebo preflight run ID for EXP-04
        required: false
        type: string

      exp06_replay:
        description: Replay the verified EXP-04 medoid inventory
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: benchmark-full-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  ROBOPROBE_ENV: ci
  OMP_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  TORCH_NUM_THREADS: "1"
  BENCH_TOLERANCE: "0.2"

jobs:
  analytic:
    if: ${{ inputs.exp04_preflight == '' && !inputs.exp06_replay }}
    name: analytic-exp02
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-backend
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Calibrate analytic EXP-02 (reduced seeds)
        working-directory: backend
        env:
          CALIBRATION_SEEDS: ${{ inputs.seeds || '10' }}
        run: >
          uv run python ../scripts/calibrate_benchmarks.py
          --seeds "$CALIBRATION_SEEDS"
          --budget 150
          --out /tmp/benchmark-current.json
      - name: Compare against weekly baseline
        id: compare
        working-directory: backend
        run: |
          set -o pipefail
          set +e
          uv run python ../scripts/compare_benchmark.py \
            tests/benchmark/baselines/full_weekly.json \
            /tmp/benchmark-current.json \
            --tolerance "${{ env.BENCH_TOLERANCE }}" \
            --summary | tee /tmp/benchmark-summary.md
          status=$?
          set -e
          cat /tmp/benchmark-summary.md >>"$GITHUB_STEP_SUMMARY"
          echo "exit_code=${status}" >>"$GITHUB_OUTPUT"
          exit "${status}"
      - name: Comment on PR (manual dispatch)
        if: >-
          always()
          && github.event_name == 'workflow_dispatch'
          && github.event.inputs.pr_number != ''
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('/tmp/benchmark-summary.md', 'utf8');
            const pr = Number(process.env.PR_NUMBER);
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr,
              body: body,
            });
        env:
          PR_NUMBER: ${{ github.event.inputs.pr_number }}


  exp04-preflight:
    if: >-
      github.event_name == 'workflow_dispatch'
      && github.repository == 'CodewithJha/RoboProbe'
      && github.ref == 'refs/heads/compute/t-120-gazebo-studies'
      && inputs.exp04_preflight != ''
    permissions:
      actions: read
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify current-main preflight provenance and wait for its result
        env:
          GH_TOKEN: ${{ github.token }}
          PREFLIGHT_RUN: ${{ inputs.exp04_preflight }}
        run: |
          set -euo pipefail
          [[ "$PREFLIGHT_RUN" =~ ^[0-9]+$ ]]
          while :; do
            result=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PREFLIGHT_RUN")
            jq -e '.head_branch=="main" and .path==".github/workflows/sim-nightly.yml"' <<<"$result" >/dev/null
            base=$(jq -r .head_sha <<<"$result")
            [[ "$base" =~ ^[0-9a-f]{40}$ ]]
            git merge-base --is-ancestor "$base" HEAD
            git diff --quiet "$base" HEAD -- backend configs docker tasks schemas ros_ws
            if [[ $(jq -r .status <<<"$result") == completed ]]; then
              jq -e '.conclusion=="success"' <<<"$result" >/dev/null
              break
            fi
            sleep 30
          done

  exp04:
    name: EXP-04 ${{ matrix.strategy }} rep ${{ matrix.replicate }}
    needs: exp04-preflight
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 345
    strategy:
      fail-fast: false
      matrix:
        strategy: [S-RANDOM, S-PROBE]
        replicate: [0, 1, 2, 3, 4]
        include:
          - strategy: S-OFAT
            replicate: 0
    env:
      STUDY_IMAGE: roboprobe-gazebo-exp04:${{ github.sha }}
      EXP04_STRATEGY: ${{ matrix.strategy }}
      EXP04_REPLICATE: ${{ matrix.replicate }}
      EXP04_PREFLIGHT: ${{ inputs.exp04_preflight }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the exact Gazebo source and prefetch pinned models
        run: |
          STUDY_OUTPUT="$RUNNER_TEMP/exp04-output"
          printf 'STUDY_OUTPUT=%s\n' "$STUDY_OUTPUT" >>"$GITHUB_ENV"
          mkdir -p "$STUDY_OUTPUT"
          chmod 1777 "$STUDY_OUTPUT"
          docker build --build-arg "REVISION=$GITHUB_SHA" -f docker/gazebo/Dockerfile -t "$STUDY_IMAGE" .
          docker volume create exp04-fuel
          docker run --rm --read-only --tmpfs /tmp -v exp04-fuel:/data/gazebo-fuel "$STUDY_IMAGE" prefetch-fuel
      - name: Create a PostgreSQL instance and record the runner environment
        run: |
          docker network create --internal exp04-net
          docker run --detach --name exp04-db --network exp04-net --network-alias postgres \
            -e POSTGRES_USER=roboprobe -e POSTGRES_DB=roboprobe \
            -e POSTGRES_PASSWORD=roboprobe-ci postgres:17
          timeout 90 bash -c 'until docker exec exp04-db pg_isready -h 127.0.0.1 -U roboprobe -d roboprobe; do sleep 2; done'
          {
            printf 'preflight_run_id=%s\n' "$EXP04_PREFLIGHT"
            printf 'git_sha=%s\n' "$GITHUB_SHA"
            printf 'software_rendering=true\nstartup_timeout_s=150\nwall_margin_s=90\n'
            uname -a
            lscpu
            free -h
            docker image inspect --format '{{.Id}}' "$STUDY_IMAGE"
            docker image inspect --format '{{index .RepoDigests 0}}' postgres:17
          } >"$STUDY_OUTPUT/environment.txt"
          docker run --rm --entrypoint /bin/bash "$STUDY_IMAGE" -c 'dpkg-query -W ros-jazzy-navigation2 ros-jazzy-nav2-bringup ros-jazzy-gz-sim-vendor' \
            >>"$STUDY_OUTPUT/environment.txt"
      - name: Collect the full registered cell with one Gazebo worker
        timeout-minutes: 310
        run: |
          set -o pipefail
          docker run --name exp04-collector --init --network exp04-net --read-only --tmpfs /tmp --shm-size=1g \
            --mount "type=bind,src=$GITHUB_WORKSPACE,dst=/checkout,readonly" \
            --mount "type=bind,src=$STUDY_OUTPUT,dst=/results" \
            --mount "type=volume,src=exp04-fuel,dst=/data/gazebo-fuel,readonly" \
            -e EXP04_STRATEGY -e EXP04_REPLICATE -e GZ_IP=127.0.0.1 -e RMW_IMPLEMENTATION=rmw_cyclonedds_cpp \
            -e PYTHONPATH=/checkout/backend/src -e LIBGL_ALWAYS_SOFTWARE=1 -e OPENBLAS_NUM_THREADS=1 \
            -e OMP_NUM_THREADS=1 -e MKL_NUM_THREADS=1 \
            -e ROBOPROBE_DATABASE__URL=postgresql+psycopg://roboprobe:roboprobe-ci@postgres/roboprobe \
            -e ROBOPROBE_STORAGE__ARTIFACT_ROOT=/results/artifacts \
            -e ROBOPROBE_BACKENDS__GAZEBO_NAV2__SOFTWARE_RENDERING=true \
            -e ROBOPROBE_BACKENDS__GAZEBO_NAV2__STARTUP_TIMEOUT_S=150 \
            -e ROBOPROBE_BACKENDS__GAZEBO_NAV2__WALL_MARGIN_S=90 \
            -e ROBOPROBE_BACKENDS__GAZEBO_NAV2__IMAGE="$STUDY_IMAGE" \
            -e GZ_SIM_RESOURCE_PATH=/checkout/ros_ws/src/roboprobe_ros/models:/opt/ros/jazzy/share \
            --entrypoint /bin/bash "$STUDY_IMAGE" -eo pipefail -c '
              install -d -m 700 "$HOME" "$ROS_HOME" "$XDG_RUNTIME_DIR"
              source /opt/ros/jazzy/setup.bash
              source /opt/roboprobe/ros_ws/install/setup.bash
              cd /checkout/backend
              /opt/roboprobe/venv/bin/roboprobe db upgrade
              /opt/roboprobe/venv/bin/python /checkout/scripts/collect_exp04.py \
                "$EXP04_STRATEGY" "$EXP04_REPLICATE" /results
            ' 2>&1 | tee "$STUDY_OUTPUT/collection.log"
      - name: Preserve the independent campaign database and any partial artifacts
        if: ${{ always() }}
        run: |
          docker stop -t 20 exp04-collector 2>/dev/null || true
          if docker inspect exp04-db >/dev/null 2>&1; then
            docker exec exp04-db pg_dump -Fc -U roboprobe -d roboprobe >"$STUDY_OUTPUT/campaign.dump"
          fi
          if [[ -d "${STUDY_OUTPUT:-}" ]]; then
            sudo chmod -R a+rX "$STUDY_OUTPUT"
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ always() }}
        with:
          name: exp04-${{ matrix.strategy }}-rep${{ matrix.replicate }}-attempt${{ github.run_attempt }}
          path: ${{ env.STUDY_OUTPUT }}
          if-no-files-found: error
          retention-days: 14


  exp06-inventory:
    if: >-
      github.event_name == 'workflow_dispatch'
      && github.repository == 'CodewithJha/RoboProbe'
      && github.ref == 'refs/heads/compute/t-120-gazebo-studies'
      && inputs.exp06_replay
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    outputs:
      cells: ${{ steps.inventory.outputs.cells }}
      source: ${{ steps.inventory.outputs.source }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate the completed EXP-04 source and medoids
        id: inventory
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          manifest=scripts/exp06_medoids.json
          source=$(jq -r .source_run "$manifest")
          sha=$(jq -r .source_commit "$manifest")
          [[ "$source" =~ ^[0-9]+$ && "$sha" =~ ^[0-9a-f]{40}$ ]]
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$source" \
            | jq -e --arg sha "$sha" '.conclusion=="success" and .head_sha==$sha' >/dev/null
          git merge-base --is-ancestor "$sha" HEAD
          git diff --quiet "$sha" HEAD -- backend configs docker tasks schemas ros_ws
          jq -e '
            (.medoids | length) as $n |
            $n > 0 and ($n == ([.medoids[].mode] | unique | length))
            and ($n == ([.medoids[].run_id] | unique | length))
          ' "$manifest" >/dev/null
          printf 'cells=%s\n' "$(jq -c .medoids "$manifest")" >>"$GITHUB_OUTPUT"
          printf 'source=%s\n' "$source" >>"$GITHUB_OUTPUT"

  exp06:
    name: EXP-06 ${{ matrix.cell.mode }}
    needs: exp06-inventory
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        cell: ${{ fromJSON(needs.exp06-inventory.outputs.cells) }}
    env:
      STUDY_IMAGE: roboprobe-gazebo-exp06:${{ github.sha }}
      MEDOID_ID: ${{ matrix.cell.run_id }}
      SOURCE_SHA: ${{ matrix.cell.source_raw_sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ matrix.cell.artifact }}
          run-id: ${{ needs.exp06-inventory.outputs.source }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/exp06-source
      - name: Verify the original dataset and prepare a private replay copy
        run: |
          set -euo pipefail
          [[ "$MEDOID_ID" =~ ^[0-9a-f-]{36}$ && "$SOURCE_SHA" =~ ^[0-9a-f]{64}$ ]]
          source="$RUNNER_TEMP/exp06-source"
          printf '%s  %s\n' "$SOURCE_SHA" "$source/runs.parquet" | sha256sum --check
          output="$RUNNER_TEMP/exp06-output"
          printf 'REPLAY_OUTPUT=%s\n' "$output" >>"$GITHUB_ENV"
          mkdir -p "$output"
          cp -a "$source/artifacts" "$output/artifacts"
          sudo chown -R 10001:10001 "$output"
          docker network create --internal exp06-net
          docker run -d --name exp06-db --network exp06-net --network-alias postgres \
            -e POSTGRES_USER=roboprobe -e POSTGRES_DB=roboprobe \
            -e POSTGRES_PASSWORD=roboprobe-ci postgres:17
          timeout 90 bash -c 'until docker exec exp06-db pg_isready -h 127.0.0.1 -U roboprobe -d roboprobe; do sleep 2; done'
          docker exec -i exp06-db pg_restore --exit-on-error --no-owner --no-privileges \
            -U roboprobe -d roboprobe <"$source/campaign.dump"
      - name: Build and warm the same pinned native Gazebo runtime
        run: |
          docker build --build-arg "REVISION=$GITHUB_SHA" -f docker/gazebo/Dockerfile -t "$STUDY_IMAGE" .
          docker volume create exp06-fuel
          docker run --rm --read-only --tmpfs /tmp -v exp06-fuel:/data/gazebo-fuel "$STUDY_IMAGE" prefetch-fuel
      - name: Replay the original medoid with five same seeds and five fresh seeds
        timeout-minutes: 65
        run: |
          docker run --name exp06-replayer --init --network exp06-net --read-only --tmpfs /tmp --shm-size=1g \
            --mount "type=bind,src=$GITHUB_WORKSPACE,dst=/checkout,readonly" \
            --mount "type=bind,src=$REPLAY_OUTPUT,dst=/results" \
            --mount "type=volume,src=exp06-fuel,dst=/data/gazebo-fuel,readonly" \
            -e MEDOID_ID -e GZ_IP=127.0.0.1 -e RMW_IMPLEMENTATION=rmw_cyclonedds_cpp \
            -e PYTHONPATH=/checkout/backend/src -e LIBGL_ALWAYS_SOFTWARE=1 -e OPENBLAS_NUM_THREADS=1 \
            -e OMP_NUM_THREADS=1 -e MKL_NUM_THREADS=1 \
            -e ROBOPROBE_DATABASE__URL=postgresql+psycopg://roboprobe:roboprobe-ci@postgres/roboprobe \
            -e ROBOPROBE_STORAGE__ARTIFACT_ROOT=/results/artifacts \
            -e ROBOPROBE_BACKENDS__GAZEBO_NAV2__SOFTWARE_RENDERING=true \
            -e ROBOPROBE_BACKENDS__GAZEBO_NAV2__STARTUP_TIMEOUT_S=150 \
            -e ROBOPROBE_BACKENDS__GAZEBO_NAV2__WALL_MARGIN_S=90 \
            -e ROBOPROBE_BACKENDS__GAZEBO_NAV2__IMAGE="$STUDY_IMAGE" \
            -e GZ_SIM_RESOURCE_PATH=/checkout/ros_ws/src/roboprobe_ros/models:/opt/ros/jazzy/share \
            --entrypoint /bin/bash "$STUDY_IMAGE" -eo pipefail -c '
              install -d -m 700 "$HOME" "$ROS_HOME" "$XDG_RUNTIME_DIR"
              source /opt/ros/jazzy/setup.bash
              source /opt/roboprobe/ros_ws/install/setup.bash
              cd /checkout/backend
              /opt/roboprobe/venv/bin/roboprobe --json replay --repeats 5 "$MEDOID_ID" >/results/same-seeds.json
              /opt/roboprobe/venv/bin/roboprobe --json replay --repeats 5 --fresh-seeds "$MEDOID_ID" >/results/fresh-seeds.json
            '
      - name: Verify complete paired replay evidence
        run: |
          sudo chmod -R a+rX "$REPLAY_OUTPUT"
          for phase in same-seeds fresh-seeds; do
            jq -e --arg source "$MEDOID_ID" '
              .source_run_id==$source and .source_verdict=="FAIL"
              and (.rows | length)==5 and (.replay_ids | unique | length)==5
              and (.agreements+.disagreements)==5
              and all(.rows[]; .verdict!=null)
            ' "$REPLAY_OUTPUT/$phase.json" >/dev/null
          done
          jq -e -s '([.[].replay_ids[]] | unique | length)==10' \
            "$REPLAY_OUTPUT/same-seeds.json" "$REPLAY_OUTPUT/fresh-seeds.json" >/dev/null
      - name: Preserve replay and failure artifacts
        if: ${{ always() }}
        run: |
          docker stop -t 20 exp06-replayer 2>/dev/null || true
          if docker inspect exp06-db >/dev/null 2>&1 && [[ -d "${REPLAY_OUTPUT:-}" ]]; then
            docker exec exp06-db pg_dump -Fc -U roboprobe -d roboprobe >"$RUNNER_TEMP/exp06-replays.dump"
            sudo mv "$RUNNER_TEMP/exp06-replays.dump" "$REPLAY_OUTPUT/replays.dump"
            sudo chmod -R a+rX "$REPLAY_OUTPUT"
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ always() }}
        with:
          name: exp06-${{ matrix.cell.mode }}-attempt${{ github.run_attempt }}
          path: ${{ env.REPLAY_OUTPUT }}
          retention-days: 14
