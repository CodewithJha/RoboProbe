name: Published app smoke

on:
  pull_request:
    paths:
      - ".github/workflows/published-app.yml"
      - "scripts/check_release_assets.py"
      - "scripts/web_image_smoke.sh"
      - "web/scripts/check-published-quickstart.mjs"
  workflow_dispatch:
    inputs:
      image_tag:
        description: Published RoboProbe image tag
        type: string
        default: main
  workflow_call:
    inputs:
      image_tag:
        description: Published RoboProbe image tag
        type: string
        required: true

permissions:
  contents: read

jobs:
  quickstart:
    name: Published images on native Ubuntu
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      ROBOPROBE_IMAGE_TAG: ${{ inputs.image_tag || 'main' }}
      WEB_SMOKE_BUILD: "0"
      WEB_SMOKE_DEMO: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-web
        with:
          node-version: "24"
      - name: Install Chromium
        working-directory: web
        run: pnpm exec playwright install --with-deps chromium
      - name: Pull the published images
        run: |
          started=$SECONDS
          docker compose -f docker/compose.yaml --profile app pull --quiet
          docker image inspect --format '{{index .RepoDigests 0}}' \
            "ghcr.io/codewithjha/roboprobe-backend:$ROBOPROBE_IMAGE_TAG" \
            "ghcr.io/codewithjha/roboprobe-web:$ROBOPROBE_IMAGE_TAG"
          printf 'Image tag: `%s`\n\nPull: %s seconds\n' "$ROBOPROBE_IMAGE_TAG" "$((SECONDS - started))" >> "$GITHUB_STEP_SUMMARY"
      - name: Verify dashboard and warehouse campaign
        env:
          WEB_SMOKE_REPORT_PATH: ${{ runner.temp }}/roboprobe-demo.html
        run: |
          started=$SECONDS
          bash scripts/web_image_smoke.sh
          printf 'App smoke and warehouse demo: %s seconds\n' "$((SECONDS - started))" >> "$GITHUB_STEP_SUMMARY"
      - name: Verify the exported HTML
        run: python3 scripts/check_release_assets.py --demo "$RUNNER_TEMP/roboprobe-demo.html"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: roboprobe-demo
          path: ${{ runner.temp }}/roboprobe-demo.html
          if-no-files-found: error
