# Playwright E2E against compose core+app (T-117, T-118, T-114).
name: e2e

on:
  pull_request:
    paths:
      - 'web/**'
      - 'backend/src/roboprobe/api/**'
      - 'docker/**'
      - 'scripts/e2e_stack.sh'
      - '.github/workflows/e2e.yml'
  schedule:
    - cron: '30 20 * * *' # 02:00 IST
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: '3.12'
  NODE_VERSION: '24'
  E2E_BASE_URL: http://127.0.0.1:8080

jobs:
  playwright:
    name: playwright
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: ./.github/actions/setup-web
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install Playwright browsers
        working-directory: web
        run: pnpm exec playwright install --with-deps chromium firefox
      - name: Stack up, seed DB, run Playwright
        run: |
          make setup
          cd web && pnpm exec playwright test --project=chromium
      - name: Playwright summary
        if: always()
        working-directory: web
        run: |
          if [[ -d playwright-report ]]; then
            echo "### Playwright report" >>"$GITHUB_STEP_SUMMARY"
            echo "Artefacts uploaded as playwright-report" >>"$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            web/playwright-report/
            web/e2e-results/
            web/e2e-artifacts/
          if-no-files-found: ignore

  lighthouse:
    name: lighthouse
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: ./.github/actions/setup-web
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Lighthouse on seeded stack
        run: |
          make setup
          bash scripts/e2e_stack.sh up
          cd web && pnpm exec lhci autorun --config=lighthouserc.live.json
      - name: Collect compose logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-compose-logs
          path: web/e2e-artifacts/compose.log
          if-no-files-found: ignore