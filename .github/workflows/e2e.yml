# Playwright E2E against compose core+app (T-117, T-118, T-114).
name: e2e

on:
  pull_request:
    paths:
      - 'web/**'
      - 'backend/src/roboprobe/api/**'
      - 'backend/alembic/**'
      - 'backend/tests/fixtures/db/**'
      - 'docker/**'
      - 'scripts/e2e_stack.sh'
      - '.github/workflows/e2e.yml'
  schedule:
    - cron: '30 20 * * *' # 02:00 IST
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '24'
  E2E_BASE_URL: http://127.0.0.1:8080
  E2E_COMPOSE_PROJECT: roboprobe-e2e-${{ github.run_id }}-${{ github.run_attempt }}

jobs:
  playwright:
    name: Playwright (${{ matrix.browser }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - browser: chromium
            spec: ''
          - browser: firefox
            spec: smoke.spec.ts
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-web
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install Playwright browsers
        working-directory: web
        run: pnpm exec playwright install --with-deps ${{ matrix.browser }}
      - name: Stack up, seed DB, run Playwright
        working-directory: web
        run: pnpm exec playwright test --project=${{ matrix.browser }} ${{ matrix.spec }}
      - name: Upload Playwright report
        if: failure()
        id: reports
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-${{ matrix.browser }}-report
          path: |
            web/playwright-report/
            web/e2e-results/
            web/e2e-artifacts/
          if-no-files-found: ignore
      - name: Link Playwright report
        if: ${{ failure() && steps.reports.outputs.artifact-url != '' }}
        env:
          ARTIFACT_URL: ${{ steps.reports.outputs.artifact-url }}
        run: printf '[Download the browser report and Compose logs](%s)\n' "$ARTIFACT_URL" >> "$GITHUB_STEP_SUMMARY"

  lighthouse:
    name: lighthouse
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-web
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Lighthouse on seeded stack
        working-directory: web
        run: bash ../scripts/e2e_stack.sh pnpm exec lhci autorun --config=lighthouserc.live.json
      - name: Collect compose logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-compose-logs
          path: web/e2e-artifacts/compose.log
          if-no-files-found: ignore
