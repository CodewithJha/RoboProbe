name: Set up backend
description: Install uv and Python, then sync the locked backend environment (all extras) with a cached uv store.
inputs:
  python-version:
    description: Python version for the backend virtualenv
    required: true
runs:
  using: composite
  steps:
    - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      with:
        python-version: ${{ inputs.python-version }}
        enable-cache: true
        cache-dependency-glob: backend/uv.lock
    - name: uv sync (locked, all extras)
      shell: bash
      run: uv sync --locked --all-extras --directory backend
