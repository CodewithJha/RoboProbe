collision_monitor:
  ros__parameters:
    cmd_vel_out_topic: /roboprobe/cmd_vel_nav
    enable_stamped_cmd_vel: false
controller_server:
  ros__parameters:
    FollowPath:
      vx_max: 0.4
    controller_frequency: 20.0
    enable_stamped_cmd_vel: false
local_costmap:
  local_costmap:
    ros__parameters:
      plugins:
      - voxel_layer
      - inflation_layer
      robot_radius: 0.22
      voxel_layer:
        depth:
          clearing: false
          data_type: PointCloud2
          marking: true
          topic: /rgbd_camera/points
        enabled: true
        observation_sources: scan depth
        scan:
          topic: /scan
velocity_smoother:
  ros__parameters:
    enable_stamped_cmd_vel: false
    max_velocity:
    - 0.4
    - 0.0
    - 2.0
