schema_version: 1
id: mixed_v1
name: Mixed parameter types
task: tasks/corridor.yaml
parameters:
  - {id: task.along, name: Along, group: task, type: float, unit: "-", low: 0.2, high: 0.8, nominal: 0.5, prior: {kind: uniform}}
  - {id: task.clearance, name: Clearance, group: task, type: float, unit: m, low: 0.0, high: 1.0, nominal: 0.5,
     prior: {kind: truncnormal, mean: 0.5, std: 0.2}}
  - {id: env.people, name: People, group: environment, type: int, unit: count, low: 0, high: 3, nominal: 1,
     prior: {kind: discrete, weights: [4, 3, 2, 1]}}
  - {id: env.layout, name: Layout, group: environment, type: categorical, unit: "-", choices: [wide, narrow],
     nominal: wide, prior: {kind: uniform}}
  - {id: env.lux, name: Illuminance, group: environment, type: float, unit: lux, low: 5, high: 1000, nominal: 300,
     scale: log, prior: {kind: loguniform}, enabled: false}
  - {id: robot.gain, name: Gain, group: robot, type: float, unit: "-", low: 0, high: 1, nominal: 0.5,
     prior: {kind: beta, a: 2, b: 2}}
constraints:
  - {expr: "env.people <= 2 or task.clearance > 0.3", note: "crowded aisles need room"}
