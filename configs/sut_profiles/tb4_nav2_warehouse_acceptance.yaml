# Opt-in Nav2 profile for nominal warehouse acceptance (T-098).
schema_version: 1
id: tb4_nav2_warehouse_acceptance
backend: gazebo_nav2
name: TurtleBot 4 Nav2 warehouse acceptance
description: Allows action acknowledgement on software rendering and reserves a margin for ground-truth goal checks.
config:
  base_nav2_params: nav2_bringup/params/nav2_params.yaml
  speed_param_paths:
    - controller_server.ros__parameters.FollowPath.vx_max
    - velocity_smoother.ros__parameters.max_velocity[0]
  nav2_overrides:
    bt_navigator:
      ros__parameters:
        default_server_timeout: 1000
    controller_server:
      ros__parameters:
        general_goal_checker:
          xy_goal_tolerance: 0.075
