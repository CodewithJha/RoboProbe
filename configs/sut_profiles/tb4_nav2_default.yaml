# TurtleBot 4 + Nav2 default stack (docs/10 §4). Nav2 parameters come from the upstream bringup file
# with this profile's overlay deep-merged on top; P1 (max speed) is written to every key in
# `speed_param_paths`. Verified for Jazzy Nav2 1.3.x MPPI in T-091 (docs/evidence/T-091).
schema_version: 1
id: tb4_nav2_default
backend: gazebo_nav2
name: TurtleBot 4 Nav2 default
description: Upstream nav2_bringup parameters (MPPI controller) for the TurtleBot 4 warehouse.
config:
  base_nav2_params: nav2_bringup/params/nav2_params.yaml
  speed_param_paths:
    - controller_server.ros__parameters.FollowPath.vx_max
    - velocity_smoother.ros__parameters.max_velocity[0]
  nav2_overrides: {}
